name: Power Scheduler APK

on:
  push:
    paths:
      - "power-scheduler/**"
      - ".github/workflows/power-scheduler-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: power-scheduler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: power-scheduler-apk
          path: power-scheduler/app/build/outputs/apk/release/*.apk
