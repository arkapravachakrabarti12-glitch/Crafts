# All values can be overridden with environment variables (see README / .env.example).
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: teachnet
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/teachnet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DATABASE_USERNAME:teachnet}
    password: ${DATABASE_PASSWORD:teachnet}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Must be at least 32 characters. ALWAYS override in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    demo-data: ${SEED_DEMO_DATA:false}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
